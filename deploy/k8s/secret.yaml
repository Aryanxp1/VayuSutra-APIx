apiVersion: v1
kind: Secret
metadata:
  name: vayusutra-secrets
  namespace: vayusutra-system
type: Opaque
stringData:
  # REQUIRED: replace with a strong random secret, e.g. `python3 -c "import secrets; print(secrets.token_hex(32))"`
  AUTH_SECRET_KEY: "CHANGE_ME__REPLACE_WITH_64_CHAR_HEX_SECRET"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vayusutra-data-pvc
  namespace: vayusutra-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
